name: Android Clean Build CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Clean everything
        run: |
          rm -rf ~/.gradle
          rm -rf .gradle
          rm -rf build
          rm -rf app/build

      - name: Ensure google-services.json
        run: |
          mkdir -p app
          if [ ! -f app/google-services.json ] || grep -q "service_account" app/google-services.json; then
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "document-editor-app",
              "storage_bucket": "document-editor-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.documenteditor.abxzw2"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForGoogleServicesValidation123"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APK
        env:
          JAVA_OPTS: "-Djava.awt.headless=true -Xmx2048m"
          GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.daemon=false"
        run: ./gradlew assembleDebug --stacktrace -Djava.awt.headless=true -Pksp.incremental=false

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Build Success
        if: success()
        run: echo "✅ Build succeeded! APK ready."
